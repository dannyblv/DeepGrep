name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Leave empty to use current commit SHA.'
        required: false

permissions:
  contents: write

# ── Shared tag logic ──────────────────────────────────────────────────────────
#  Both build jobs and the release job need the same tag value.
#  We compute it once in a tiny pre-job and pass it via outputs.
jobs:

  # ── 0. Resolve release tag ──────────────────────────────────────────────────
  resolve-tag:
    runs-on: mac
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "value=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Rust build (parallel) ────────────────────────────────────────────────
  build-rust:
    runs-on: mac
    needs: resolve-tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build Rust crates (release)
        run: cargo build --release

      - name: Stage Rust binary
        run: |
          mkdir -p dist-release
          if [ -f target/release/deepgrep ]; then
            cp target/release/deepgrep dist-release/deepgrep-indexer-macos
          else
            echo "WARNING: target/release/deepgrep not found — skipping binary"
          fi

      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: dist-release/deepgrep-indexer-macos
          if-no-files-found: warn

  # ── 2. JS / Extension build (parallel) ─────────────────────────────────────
  build-js:
    runs-on: mac
    needs: resolve-tag
    outputs:
      electron_version: ${{ steps.electron.outputs.version }}
      vscode_tag:       ${{ steps.electron.outputs.vscode_tag }}
      vsix_name:        ${{ steps.vsix.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── Detect VS Code Electron version ──────────────────────────────────────
      #
      #  better-sqlite3 must be compiled against the exact Electron ABI that
      #  ships inside VS Code.  We query the VS Code update API to find the
      #  current stable tag, then read electronVersion from that tag's package.json.
      #
      - name: Detect VS Code Electron version
        id: electron
        run: python3 .github/scripts/detect_electron.py

      - name: Rebuild better-sqlite3 for Electron ${{ steps.electron.outputs.version }}
        working-directory: packages/extension
        env:
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}
        run: |
          npx --yes @electron/rebuild@latest \
            -v "$ELECTRON_VERSION" \
            -w better-sqlite3

      - name: Type-check webview UI
        working-directory: packages/webview-ui
        run: pnpm exec tsc --noEmit

      - name: Run extension unit tests (rebuilds native addon for Node.js, restores for Electron)
        working-directory: packages/extension
        run: node scripts/run-tests.mjs

      - name: Build all packages (extension + webview + mcp-server)
        run: pnpm build

      - name: Package .vsix
        working-directory: packages/extension
        run: pnpm package

      - name: Verify VSIX integrity (post-package gate)
        working-directory: packages/extension
        run: pnpm test:vsix

      - name: Locate .vsix artifact
        id: vsix
        run: |
          VSIX_PATH=$(ls packages/extension/*.vsix | head -1)
          VSIX_NAME=$(basename "$VSIX_PATH")
          echo "path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX_NAME ($(du -sh $VSIX_PATH | cut -f1))"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.path }}

      - name: Upload MCP server bundle
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server
          path: packages/extension/dist/mcp-server.js
          if-no-files-found: warn

  # ── 3. Create GitHub Release (after both builds) ────────────────────────────
  release:
    runs-on: mac
    needs: [resolve-tag, build-rust, build-js]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: List artifacts
        run: ls -lhR dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.value }}
          name: DeepGrep ${{ needs.resolve-tag.outputs.value }}
          draft: false
          prerelease: ${{ !startsWith(github.ref_name, 'v') }}
          generate_release_notes: true
          body: |
            ## DeepGrep ${{ needs.resolve-tag.outputs.value }}

            Built against **VS Code ${{ needs.build-js.outputs.vscode_tag }}** / Electron **${{ needs.build-js.outputs.electron_version }}** on macOS.

            ### Installation
            1. Download `${{ needs.build-js.outputs.vsix_name }}` below.
            2. In VS Code: **Extensions** → `···` → **Install from VSIX…** → select the file.
            3. Reload VS Code.

            ### Files in this release
            | File | Description |
            |------|-------------|
            | `${{ needs.build-js.outputs.vsix_name }}` | VS Code extension (install this) |
            | `mcp-server.js` | Standalone MCP stdio server (optional) |
            | `deepgrep-indexer-macos` | Native Rust indexer binary (optional) |

            > **Note:** `better-sqlite3` inside the `.vsix` is pre-compiled for Electron ${{ needs.build-js.outputs.electron_version }}.
            > If VS Code upgrades its Electron version, rebuild from source or wait for the next release.
          files: |
            dist-release/vsix/${{ needs.build-js.outputs.vsix_name }}
            dist-release/mcp-server/mcp-server.js
            dist-release/rust-binary/deepgrep-indexer-macos
